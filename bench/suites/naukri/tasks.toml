# Real-repo suite: NaukriApply (Python, ~5k lines, pytest; browser tests excluded because they drive Playwright).
# Snapshot = `git archive HEAD`; the project's .venv is shared through a junction; bugs planted before the commit.

[suite]
name = "naukri"
repo = "C:/Users/Ganesh/OneDrive/Documents/personal projects/NaukriApply"
snapshot = "git"
ref = "HEAD"
link = [".venv"]
max_budget_usd = 1.50
timeout = 1200

[[task]]
id = "search"
category = "code lookup"
prompt = "Which function drops a job before scoring because it is obviously not a software role, and which constant holds the words it accepts as software roles? Reply with the function name, the constant name and the file."
answer_contains = ["is_obvious_non_match", "SOFTWARE_ROLE_HINTS", "matching.py"]
max_budget_usd = 0.60

[[task]]
id = "bugfix"
category = "small bug fix"
setup = [["{python}", "{suite}/inject.py", "bugfix"]]
prompt = "Bug report: jobs whose descriptions list my exact skills (Python, SQL, AWS) now get a skill score of 0, so good matches rank low. Find and fix the cause in the source (do not change tests). Run the tests with `.venv/Scripts/python -m pytest -q tests/test_matching.py`."
verify = [["C:/Users/Ganesh/OneDrive/Documents/personal projects/NaukriApply/.venv/Scripts/python.exe", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/test_matching.py", "tests/test_workflow.py"]]
max_budget_usd = 1.00

[[task]]
id = "debug"
category = "cross-module debugging"
setup = [["{python}", "{suite}/inject.py", "debug"]]
prompt = "Jobs that say 'Experience: 1 to 3 years' are marked 'experience range appears outside the target' even though my target is 2 years, while '1-3 years' still works. Find the root cause and fix it. Run the tests with `.venv/Scripts/python -m pytest -q tests/test_matching.py`."
hidden = "hidden/debug"
verify = [["C:/Users/Ganesh/OneDrive/Documents/personal projects/NaukriApply/.venv/Scripts/python.exe", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/test_matching.py", "tests/test_hidden_experience.py"]]
max_budget_usd = 1.50
