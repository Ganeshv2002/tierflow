# tierflow default policy. Do not edit this file to customise; copy the keys you want to change into
#   ~/.claude/tierflow/config.toml            (user policy: may change anything)
#   <repo>/.claude/tierflow.toml              (project config: may only tighten, see docs/ARCHITECTURE.md §6)

[orchestrator]
mode = "balanced"            # economy | balanced | quality

# Tier -> Claude Code model alias. Aliases are resolved by Claude Code at run time; pin versions with
# ANTHROPIC_DEFAULT_HAIKU_MODEL / _SONNET_ / _OPUS_ if you need to.
[models]
light = "haiku"
standard = "sonnet"
reasoning = "opus"

[routing]
inject_hint = true
min_prompt_chars_for_hint = 15
# What to do when an Opus-tier delegation happens without a complex/high-risk classification or a
# recorded escalation. "auto" = economy: ask, balanced: warn, quality: allow.
opus_gate = "auto"           # auto | allow | warn | ask | deny
# Categories that never get a routing hint (the main session just does the work). `orch tune` suggests
# entries here when your own metrics show a category's hints are ignored or its delegations cost more.
hint_categories_off = []

# Subagent name -> tier and whether it edits files. Names without a namespace match plugin agents too.
[agents.scout]
tier = "light"
edits = false
[agents.mechanic]
tier = "light"
edits = true
scope_locked = true           # edits outside the brief's FILES: line need approval
[agents.implementer]
tier = "standard"
edits = true
[agents.reviewer]
tier = "standard"
edits = false
[agents.architect]
tier = "reasoning"
edits = false
# Built-in Claude Code agents
[agents.Explore]
tier = "light"
edits = false
[agents.general-purpose]
tier = "inherit"
edits = true
[agents.Plan]
tier = "inherit"
edits = false

[context]
reuse_codebase_map = true
extra_map_paths = []
max_context_tokens = 6000     # estimate: chars / 4
snippet_lines = 8
max_files = 12
max_hits_per_file = 4
exclude_dirs = ["node_modules", ".git", "bin", "obj", "dist", "build", "out", ".next", "coverage",
                "__pycache__", ".venv", "venv", "packages", ".vs", ".idea", "target"]

[session]
# Every request re-reads the whole conversation, so cost per request grows with the session. Once the
# context passes this many tokens, tierflow shows you (not the model: no tokens) a one-line suggestion to
# /compact or start a fresh session. 0 = off.
warn_context_tokens = 200000
rewarn_every_tokens = 100000  # warn again only after the context grew this much more

# `orch tune`: how much evidence a suggestion needs.
[tune]
min_samples = 10              # prompts (or agent runs) per compared group
min_difference = 0.25         # relative cost difference before anything is suggested

[validation]
timeout_seconds = 900
test_affected_modules = true
verify_downstream_dependencies = true
max_failure_lines = 40
run_typecheck = true
run_lint = false              # linters can be slow on big repos; enable per project

[escalation]
enabled = true
max_retries = 2               # failed attempts allowed per tier before moving up
max_total_attempts = 5        # then stop and ask the human

[budgets]
max_cost_per_task_usd = 2.00      # task = one user prompt and everything it triggers
max_cost_per_session_usd = 25.00
enforcement = "ask"               # ask | deny | warn | off   (applies at delegation time)
# Tiers never blocked by a budget (only warned): refusing a cheap delegation would push the same
# work into the main session, which costs more.
exempt_tiers = ["light"]

# Conservative per-delegation reservations used before a subagent runs (we cannot know its cost
# in advance). Tune from `orch report`.
[budgets.reservation_usd]
light = 0.02
standard = 0.40
reasoning = 1.20

# List prices, USD per million tokens, as of 2026-10. Longest matching prefix of the model id wins.
# cache_write_5m = 1.25 x input, cache_write_1h = 2 x input.
# Models not listed here get cost = null (reported as unknown, never guessed).
[pricing."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write_5m = 5.0
cache_write_1h = 8.0
[pricing."claude-opus-5"]
